name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate KKiaPay configuration
        env:
          VITE_KKIAPAY_PUBLIC_KEY: ${{ vars.VITE_KKIAPAY_PUBLIC_KEY || secrets.VITE_KKIAPAY_PUBLIC_KEY || vars.KKIAPAY_PUBLIC_KEY || secrets.KKIAPAY_PUBLIC_KEY }}
        run: |
          if [ -z "$VITE_KKIAPAY_PUBLIC_KEY" ]; then
            echo "::error::Configure the KKiaPay public key as VITE_KKIAPAY_PUBLIC_KEY (or KKIAPAY_PUBLIC_KEY) in the github-pages environment or repository Actions settings."
            exit 1
          fi
          echo "KKiaPay public key is configured."
      - name: Build site
        run: npm run build -- --base=/Caleb_Portfolio/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_KKIAPAY_PUBLIC_KEY: ${{ vars.VITE_KKIAPAY_PUBLIC_KEY || secrets.VITE_KKIAPAY_PUBLIC_KEY || vars.KKIAPAY_PUBLIC_KEY || secrets.KKIAPAY_PUBLIC_KEY }}
          VITE_KKIAPAY_SANDBOX: ${{ vars.VITE_KKIAPAY_SANDBOX || secrets.VITE_KKIAPAY_SANDBOX }}
      - name: Add GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
